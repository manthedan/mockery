<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>Mockery — practice the interview out loud, then run one for someone else</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="#141413"/>
  <image href="wordmark-on-dark.svg" x="58" y="56" width="186" height="42"/>
  <rect x="68" y="262" width="214" height="52" rx="5" fill="#f4c440" opacity="0.30"/>
  <g font-family="'New York', ui-serif, 'Iowan Old Style', Palatino, Georgia, serif" font-size="56" letter-spacing="-.6">
    <text x="72" y="238" fill="#efeeea">Practice the interview</text>
    <text x="72" y="306" fill="#efeeea">out loud.</text>
    <text x="72" y="374" fill="#939189">Then run one for</text>
    <text x="72" y="442" fill="#939189">someone else.</text>
  </g>
  <text x="72" y="512" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif" font-size="21" fill="#b4b2ab">A calm, local-first mock interview studio for Apple Silicon.</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14.5" fill="#939189" letter-spacing=".3">
    <circle cx="77" cy="571" r="4.5" fill="#62c08d"/>
    <text x="92" y="576">Speech stays on your Mac  ·  v0.2.0  ·  MIT</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="690" y="92" width="920" height="605.0" rx="11" fill="#141413"/>
  </g>
  <clipPath id="w1"><rect x="690" y="92" width="920" height="605.0" rx="11"/></clipPath>
  <g clip-path="url(#w1)">
    <rect x="690" y="92" width="920" height="30" fill="#1d1d1b"/>
    <circle cx="708" cy="107.0" r="4.5" fill="#68665f" opacity=".7"/>
    <circle cx="724" cy="107.0" r="4.5" fill="#68665f" opacity=".7"/>
    <circle cx="740" cy="107.0" r="4.5" fill="#68665f" opacity=".7"/>
    <text x="1150.0" y="111.0" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#939189">127.0.0.1:8765</text>
    <image href="screenshots/05_whiteboard_dark.png" x="690" y="122" width="920" height="575.0" preserveAspectRatio="xMidYMid slice"/>
    <rect x="690" y="121.5" width="920" height="1" fill="#fffdf5" opacity="0.16"/>
