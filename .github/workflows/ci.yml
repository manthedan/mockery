name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and tests (macOS arm64)
    # The test suite uses macOS `say` for real speech fixtures and MLX for on-device ASR.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Cache Hugging Face models
        # Parakeet ASR, WeSpeaker and Silero VAD weights (~2.3 GB), keyed on the files that pin them.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/mockery/addons.py', 'src/mockery/diarizer.py', 'src/mockery/models.py', 'src/mockery/vad.py') }}
          restore-keys: |
            hf-models-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff, architecture lint, JS syntax and pytest
        run: uv run --frozen python scripts/check.py
