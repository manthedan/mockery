[project]
name = "mock-helper"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "manthedan", email = "3868926+manthedan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "openai>=3.52.0",
    "parakeet-mlx>=0.7.0",
    "python-dotenv>=1.2.4",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
mock-helper = "mock_helper:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
