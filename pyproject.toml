[project]
name = "mockery"
version = "0.2.0"
description = "Mockery — Local-first Apple Silicon mock interview studio"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "manthedan", email = "3868926+manthedan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.6.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "openai>=3.52.0",
    "parakeet-mlx>=0.7.0",
    "ptts>=0.7.1",
    "pypdf>=5.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.20",
    "soundfile>=0.14.0",
    "tokenizers>=0.21.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.urls]
Homepage = "https://github.com/manthedan/mockery"
Repository = "https://github.com/manthedan/mockery"

[project.scripts]
mockery = "mockery:main"
mock-helper = "mockery:main"

[project.optional-dependencies]
gepa = [
    "gepa>=0.1.0",
    "litellm>=1.60.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
